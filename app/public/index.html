<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Callout Job Cards</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main style="max-width: 960px">
      <h1>Callout job cards</h1>
      <div class="muted">Open callouts and completed job cards.</div>
      <div class="card scroll">
        <table>
          <thead>
            <tr>
              <th>Ticket</th>
              <th>Client / site</th>
              <th>Technician</th>
              <th>Status</th>
              <th>Left</th>
              <th>Arrived</th>
              <th>Signed out</th>
              <th>Closed</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
    <script src="/index.js"></script>
  </body>
</html>
